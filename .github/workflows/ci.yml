name: Backend checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nfctag_test
          POSTGRES_PASSWORD: ci_only_test_password
          POSTGRES_DB: nfctag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfctag_test -d nfctag_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nfctag_test:ci_only_test_password@127.0.0.1:5432/nfctag_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
