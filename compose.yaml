# A local development database. Run the Go server on the host; .env is not read by Go.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nfctag
      POSTGRES_DB: nfctag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfctag -d nfctag"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
